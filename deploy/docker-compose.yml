services:
  sub-proxy-v3:
    build: .
    container_name: sub-proxy-v3
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/data
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4080/health')"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - remnawave-network

networks:
  remnawave-network:
    external: true
